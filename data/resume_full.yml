summary: |
  Sou profissional de Dados com formação em Estatística pela Universidade Estadual de Maringá (UEM) e aproximadamente 5 anos de experiência construindo soluções na interseção entre Estatística, Data Science, Data Analytics, Business Intelligence e Data Engineering.
  Minha trajetória começou na análise de dados e evoluiu para Ciência de Dados e Business Intelligence, passando por diferentes contextos corporativos e problemas de negócio.

  Na Crefaz, atuei como Analista de Dados e posteriormente como Cientista de Dados Pleno, trabalhando com crédito, risco, políticas de aprovação, indicadores, dashboards e estudos analíticos.
  No Sicredi, ampliei minha experiência em Business Intelligence, indicadores financeiros e contábeis, automação e processos estruturados de dados.
  Ao longo dessa trajetória, também desenvolvi soluções relacionadas à integração, tratamento, padronização e disponibilização de dados para análises e indicadores.
  Minha formação em Estatística é a base da minha maneira de trabalhar: compreender a variabilidade, avaliar evidências, lidar com incertezas e transformar análises quantitativas em suporte à decisão.

  Tenho experiência com Python, SQL, R, Power BI, PySpark, Pandas, PostgreSQL, Luigi, UiPath e Git/GitLab. Minha atuação envolve Statistical Modeling, análise exploratória, modelagem preditiva, ETL, Data Pipelines, automação, Data Visualization e Dashboard Development. 
  Mais do que produzir análises, busco entender o problema que está por trás do dado e construir soluções que sejam realmente úteis para quem precisa tomar decisões.
  Acredito na conexão entre dados, tecnologia e negócio como caminho para transformar informação em inteligência aplicada.
  
  Meu propósito é reduzir incertezas, apoiar decisões melhores e transformar dados em conhecimento acionável.
  Minha missão é utilizar estatística, tecnologia e visão de negócio para desenvolver soluções analíticas que apoiem decisões melhores e gerem valor mensurável.
  Busco continuar evoluindo em Analytics avançado, Estatística Aplicada, Ciência de Dados orientada a problemas reais e engenharia de soluções analíticas.
  Meu objetivo de carreira é combinar excelência técnica, aprendizado contínuo e comunicação clara para transformar problemas complexos em soluções de dados capazes de gerar impacto real.

