projects:
  - id: analytics-shiny-dashboard
    title: "Gestão Analítica de Custos Rateados — Área Contábil e Financeira de Cooperativa de Crédito"
    short_description: "O projeto nasceu de uma dor recorrente na gestão dos Custos Rateados recebidos da Central Administrativa: embora os dados financeiros estivessem disponíveis, o acompanhamento apresentava baixa visibilidade gerencial sobre quanto e onde os gastos estavam alocados, como evoluíam ao longo do tempo, quais componentes provocavam oscilações e onde estavam concentradas as principais despesas. A dependência de consolidações e análises manuais também dificultava a investigação de desvios e a identificação tempestiva de oportunidades de otimização.
      A solução utilizou o Microsoft Power BI como plataforma de Business Intelligence, combinando Power Query e Linguagem M para extração, tratamento e consolidação dos dados, modelagem dimensional para estruturar o modelo analítico e DAX para construção de métricas e indicadores gerenciais. O dashboard integrou as frentes de Licenças e Softwares, Serviços Centralizados e Sustentação e Utilização de Produtos e Serviços, disponibilizando visão histórica, análise de composição, concentração, variações e comportamentos que demandavam investigação.
      O principal impacto foi transformar dados financeiros em visibilidade analítica para gestão e decisão. A solução fortaleceu a capacidade de responder, de forma rápida e estruturada, quanto e onde os gastos estavam alocados, como estavam evoluindo, quais componentes explicavam suas oscilações, onde estavam as maiores concentrações e quais pontos mereciam investigação e ação. Com isso, a área passou a contar com uma base mais consistente para priorizar análises, revisar despesas, direcionar iniciativas de racionalização e acompanhar oportunidades de otimização, reduzindo esforço manual, aumentando a transparência e fortalecendo a gestão financeira baseada em dados.
      
      Competências: Microsoft Power BI | DAX | Power Query / Linguagem M | Modelagem de dados | Controle de Custos | Otimização de Custos | Suporte à Tomada de Decisão | Gestão Baseada em Dados"
