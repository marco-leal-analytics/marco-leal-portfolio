      - text: "Desenvolveu soluções de Credit Analytics, Risk Analytics e Business Intelligence para monitoramento da originação de crédito, estruturando indicadores, análises multidimensionais e mecanismos de acompanhamento das políticas de decisão parametrizadas no motor Crivo, com foco em governança de crédito, performance operacional, identificação de gargalos e suporte à tomada de decisão baseada em dados."
        subbullets:
          - text: "Dashboard de Originação e Monitoramento de Políticas de Crédito: Este projeto demonstrou como o Microsoft Power BI, combinado à modelagem analítica, métricas DAX e visualizações avançadas, transformou dados de uma operação de aproximadamente 1,6 milhão de propostas mensais em uma camada integrada de monitoramento da esteira de crédito. A solução acompanhava a jornada das propostas desde a digitação até a aprovação para mesa, monitorando 1.664.003 propostas digitadas, 936.051 recusadas e 691.855 aprovadas em P1, além de retenções, taxas de conversão e impacto individual das políticas parametrizadas no motor Crivo. Foram implementadas análises por produto, modalidade, matriz, hierarquia comercial, UF, companhia elétrica, vendedor, período e faixa horária, incluindo análises waterfall para decomposição da influência das regras sobre aprovação, recusa e retenção."
            subbullets:
            - "Impacto: Aumento da visibilidade sobre uma operação de alto volume, fortalecimento da governança das políticas de crédito e maior capacidade de monitoramento da esteira decisória. A solução permitiu identificar padrões de comportamento, concentração de impacto das regras, gargalos operacionais e oportunidades de otimização das políticas, apoiando Crédito, Risco, Operações e Negócios na tomada de decisões baseada em evidências. A análise histórica também evidenciou crescimento de 30,3% nas propostas digitadas, 36,8% nas recusas e 17,4% nas aprovações P1 entre os períodos analisados."
            - "Competências: Credit Analytics · Risk Analytics · Microsoft Power BI · Credit Policy Monitoring · Credit Policy Governance · Data Modeling · DAX · Dashboard Development · Decision Engine Analysis · Waterfall Analysis"
      - text: "Desenvolveu estudo para análise de risco, inadimplência, perda esperada e rentabilidade, análise exploratória para segmentação de clientes e estudos de risco-retorno, com foco em precificação diferenciada, otimização da concessão, gestão de portfólio e geração de valor ajustado ao risco."
        subbullets:
        - text: "Matriz de Risco: Este projeto demonstrou como uma abordagem analítica orientada a risco pode transformar dados de crédito e comportamento em inteligência para decisão, permitindo identificar grupos homogêneos de risco, avaliar a relação entre inadimplência, perda esperada e retorno, analisar diferenças de rentabilidade entre segmentos e construir uma Matriz de Risco capaz de associar perfis de clientes a estratégias de pricing, concessão e gestão de portfólio."
          subbullets:
          - "Impacto: Maior granularidade na avaliação de risco e rentabilidade, possibilitando identificar oportunidades de precificação diferenciada, segmentos com melhor relação risco-retorno, concentrações de risco e grupos com necessidade de revisão de políticas ou condições comerciais, contribuindo para maior alinhamento entre risco, preço e retorno, otimização da carteira, melhoria das decisões de crédito e alocação mais eficiente de capital."
          - "Competências: Credit Analytics · Risk Analytics · Credit Risk Modeling · Expected Loss · Statistical Modeling · Quantitative Analysis · Portfolio Analytics · Risk-Adjusted Return · Pricing Strategy · Excel"

