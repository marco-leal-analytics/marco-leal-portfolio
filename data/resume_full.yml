  - id: analytics-shiny-dashboard
    title: "Engenharia de Dados, Integração de Sistemas e Business Intelligence na Transição Sistêmica RBM → CODE"
    short_description: "Durante a transição sistêmica entre RBM e CODE, a organização enfrentava o desafio de manter a continuidade dos processos de Business Intelligence e Analytics enquanto os produtos eram migrados gradualmente entre uma plataforma legada e uma nova plataforma operacional. A coexistência dos dois ambientes gerava diferenças estruturais e semânticas nas bases, incluindo nomenclaturas, status, produtos, decisões, etapas, datas, códigos de propostas, canais, subcanais e hierarquias comerciais. Esse cenário aumentava o risco de inconsistências nos indicadores, duplicidades, tratamentos manuais e interpretações divergentes dos dados corporativos.
      Para solucionar o problema, foi desenvolvido um pipeline de Engenharia de Dados utilizando Python, PySpark e Pandas, responsável pela extração, transformação, padronização, validação e consolidação das informações provenientes dos dois sistemas. A solução implementou regras de de-para e harmonização para estabelecer correspondências entre os diferentes modelos de dados, além de realizar conversão de tipos, normalização de datas, tratamento de duplicidades, validações de consistência e aplicação de regras de negócio. Dessa forma, foi criada uma camada de integração capaz de abstrair as diferenças entre RBM e CODE e disponibilizar uma representação única e consistente para BI, Analytics e áreas de negócio.
      
      Como impacto, o projeto garantiu a continuidade analítica durante o rollout dos produtos, preservando relatórios, dashboards e indicadores corporativos existentes. A centralização das regras reduziu inconsistências e dependências de tratamentos manuais, aumentando a confiabilidade, padronização e rastreabilidade das informações. A solução também permitiu que a organização avançasse na transformação tecnológica sem transferir a complexidade da migração para os consumidores dos dados, fortalecendo a governança da informação e o suporte à tomada de decisão baseada em dados.

      Competências: Python · PySpark · Pandas · Data Engineering · Data Integration · ETL / ELT · Data Harmonization · Data Mapping · Data Quality · Systems Integration"
    demo: "https://marcoleal.shinyapps.io/analytics-shiny-dashboard"
    featured: true
  
  - id: analytics-shiny-dashboard
    title: "Case Corporativo — Analytics Operacional, Business Intelligence e Automação da Distribuição de Indicadores Comerciais"
    short_description: "O projeto surgiu a partir da necessidade de ampliar a velocidade e a disponibilidade dos indicadores de performance comercial para uma operação com mais de 100 lojas. Antes da implementação, a obtenção das informações dependia de consultas manuais, consolidações recorrentes, geração de relatórios e solicitações à equipe de Business Intelligence. Esse modelo aumentava o esforço operacional, limitava a frequência de atualização e dificultava que gestores e equipes comerciais tivessem acesso tempestivo aos dados necessários para acompanhar resultados, identificar desvios e tomar decisões.
      Como solução, foi desenvolvido um pipeline automatizado de Analytics e Business Intelligence integrado ao CRM Bitrix. O processo passou a realizar diariamente a extração dos dados comerciais, tratamento, transformação, padronização e consolidação das informações, permitindo calcular indicadores relacionados a leads, atendimentos, contatos, conversões, produtividade, performance e evolução dos resultados. O processamento analítico foi desenvolvido em R, enquanto o RMarkdown foi utilizado para geração automatizada e padronizada dos relatórios. Na etapa de distribuição, Python e integração via API possibilitaram o envio automatizado das informações por meio do WhatsApp Enterprise para as lojas e equipes envolvidas.

      O impacto foi a transformação de um processo manual e reativo em uma estrutura automatizada, recorrente e escalável. A solução aumentou a disponibilidade e a velocidade de acesso aos indicadores, reduziu atividades repetitivas e a dependência de solicitações à equipe de BI, além de ampliar a padronização e rastreabilidade das informações. A distribuição diária democratizou o acesso aos dados e fortaleceu a gestão comercial, permitindo acompanhar tendências, comparar unidades, identificar oportunidades e direcionar ações com maior agilidade. O projeto consolidou o Analytics como parte da rotina operacional e fortaleceu uma cultura de decisão orientada por dados."
