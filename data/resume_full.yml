summary: |
  Profissional de Dados com formação em Estatística pela Universidade Estadual de Maringá (UEM) e aproximadamente 5 anos de experiência na construção de soluções de Análise de Dados,
  Ciência de Dados, Inteligência de Negócios e Engenharia de Dados. Atuação com Python, SQL, R, Power BI, PySpark e PostgreSQL, aplicados à análise exploratória, visualização de dados, 
  integração e transformação de informações, construção de pipelines e automação de processos. Experiência na criação de painéis e indicadores para monitoramento de operações de crédito, 
  risco, desempenho financeiro e comercial, transformando grandes volumes de dados em informações para identificação de padrões, gargalos, tendências e oportunidades de melhoria.

  Experiência em Análise de Crédito e Risco, incluindo análise da originação, monitoramento de políticas de crédito, indicadores, inadimplência, perda esperada, rentabilidade e suporte
  à decisão. Atuação também em Inteligência de Negócios aplicada às áreas financeira e contábil, desenvolvimento de painéis e indicadores, engenharia e integração de dados, automação e
  disponibilização estruturada de informações para diferentes áreas do negócio. Na Engenharia de Dados, desenvolvi pipelines automatizados para extração, transformação, padronização, 
  validação e disponibilização de dados, incluindo integração entre sistemas e orquestração de processos. Em Automação, desenvolvi soluções com Python e UiPath para substituir atividades 
  manuais e repetitivas por fluxos controlados, rastreáveis e escaláveis.

  Combino Estatística Aplicada, análise de dados, visualização, engenharia de dados, automação e visão de negócio para transformar dados em informações acionáveis e soluções que apoiam 
  decisões, explicam comportamentos, identificam oportunidades, reduzem riscos e geram valor. Entre os resultados da minha atuação estão o monitoramento analítico de uma operação de 
  aproximadamente 1,6 milhão de propostas de crédito por mês, a automação de pipelines corporativos e processos operacionais, o processamento de mais de 12 mil atendimentos automatizados
  e a integração de dados durante a transição entre sistemas, garantindo continuidade, qualidade e confiabilidade das informações.

short_summary: "Analista de Dados com aproximadamente 5 anos de experiência em Python, SQL, R, Power BI e PySpark, atuando na construção de soluções de Data Analytics, Business Intelligence, Data Science e Data Engineering. Formação em Estatística pela UEM, com experiência em análise exploratória, modelagem estatística e preditiva, ETL, Data Pipelines, Data Visualization e automação de processos.

Experiência em Crédito e Risco, incluindo análise de originação, monitoramento de políticas de crédito, indicadores, risco, perda esperada e suporte à decisão. Atuação também em Business Intelligence financeiro e contábil, desenvolvimento de dashboards, engenharia e integração de dados, automação e disponibilização de informações para diferentes áreas de negócio.

Combino Estatística Aplicada, tecnologia e visão de negócio para transformar dados em análises, indicadores e soluções que apoiam decisões, reduzem incertezas e geram valor para a organização."

