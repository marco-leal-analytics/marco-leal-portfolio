summary: |
  Profissional de Dados com formação em Estatística pela Universidade Estadual de Maringá (UEM) e aproximadamente 5 anos de experiência em Data Analytics, Business Intelligence, Ciência de Dados, modelagem estatística, automação e engenharia de dados. 
  
  Experiência profissional em Crefaz como Cientista de Dados Pleno e Analista de Dados, e em Sicredi como Analista de Business Intelligence II, atuando em ambientes de crédito, risco, finanças, cooperativismo e operações. Forte atuação na transformação de dados em insights, indicadores,dashboards, estudos analíticos e suporte à tomada de decisão baseada em dados. 
  
  Experiência com Python, SQL, R, Power BI, PySpark, Pandas, PostgreSQL, Luigi, UiPath e Git/GitLab, incluindo desenvolvimento de ETL, pipelines de dados, automações, integrações e soluções analíticas. Sólida base em estatística aplicada, modelagem preditiva, análise exploratória, regressão, métodos não paramétricos, validação cruzada e avaliação de modelos.Experiência na análise de políticas de crédito, indicadores financeiros e operacionais, governança de dados e identificação de oportunidades de eficiência. 

  Orientado à geração de valor, com capacidade de conectar dados, estatística, tecnologia e necessidades de negócio para desenvolver soluções analíticas de ponta a ponta.


