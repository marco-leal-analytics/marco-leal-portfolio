  - id: analytics-shiny-dashboard
    title: "Automação de Processos para Identificação e Exclusão de Associados Inativos e sem Reciprocidade"
    short_description: "O projeto surgiu a partir de uma dor operacional relacionada à manutenção de mais de 5.000 associados inativos e sem reciprocidade em uma instituição financeira cooperativa. O processo de identificação e exclusão era predominantemente manual, exigindo levantamento de informações em diferentes bases, consolidação de dados, aplicação de critérios de elegibilidade, validações e execução individual das exclusões. Esse modelo consumia capacidade operacional significativa, apresentava baixa escalabilidade e dependia diretamente da intervenção das equipes, além de aumentar a exposição a erros, inconsistências, retrabalho e atrasos. A manutenção desses registros também representava uma oportunidade de otimização de custos, diante da existência de associados sem atividade ou reciprocidade.
      
      A solução combinou Python e UiPath para transformar o fluxo manual em um processo automatizado e controlado. O Python foi utilizado para extração, tratamento, transformação, consolidação e validação dos dados, além da aplicação dos critérios de elegibilidade e geração das listas de processamento. O UiPath automatizou a execução operacional dos registros elegíveis, incorporando controles, tratamento de exceções, logs e rastreabilidade. Dessa forma, a solução estabeleceu um fluxo estruturado de dados, regras de negócio, validação, execução e monitoramento, reduzindo a dependência de atividades manuais.
      
      O principal impacto foi a automação da identificação, processamento e exclusão de mais de 5.000 associados, com redução significativa do esforço manual, aumento da produtividade e maior padronização e rastreabilidade da execução. A solução também reduziu a exposição a erros operacionais, inconsistências e retrabalho. Considerando o custo médio estimado de R$ 2,80 por associado, o projeto representa uma oportunidade de redução de custo fixo mensal de aproximadamente R$ 14.000, equivalente a cerca de R$ 168.000 anualizados sob a mesma premissa. O resultado demonstra a capacidade de transformar uma atividade operacional recorrente em um processo escalável, orientado por dados e automatizado, combinando eficiência operacional, controle e geração mensurável de valor para o negócio.
      
      Competências: Python · UiPath · RPA · Automação de Processos · Processamento de Dados · Validação de Dados · Análise de Dados · Automação de Regras de Negócio · Automação de Fluxos de Trabalho · Tratamento de Exceções · Registro de Logs · Monitoramento · Analytics Operacional · Otimização de Processos · Eficiência Operacional · Redução de Custos · Redução de Riscos"
    demo: "assets/www/cases/Automação-de-Processos-para-Identificação-e-Exclusão-de-Associados-Inativos-e-sem-Reciprocidade"
