  - id: analytics-shiny-dashboard
    title: "Engenharia de Dados e Modernização Analítica"
    short_description: "O projeto surgiu a partir de um processo AS-IS altamente manual, descentralizado e dependente do conhecimento individual dos usuários para obtenção e disponibilização de dados corporativos. A necessidade de uma análise iniciava com o acesso à plataforma Denodo, identificação manual de tabelas, views e consultas, seguida por extrações recorrentes para CSV ou Excel. Os arquivos eram armazenados em computadores pessoais, pastas compartilhadas ou repositórios locais e posteriormente tratados, consolidados e utilizados na construção de relatórios, dashboards e indicadores. Esse fluxo gerava retrabalho, duplicidade de esforços, riscos operacionais, inconsistências entre áreas, baixa rastreabilidade e dificuldades para garantir atualizações recorrentes e padronizadas.
      
      A solução TO-BE transformou esse modelo em uma arquitetura corporativa de dados automatizada, parametrizada e orientada por metadados. Foi desenvolvido um pipeline utilizando Python, Luigi, SQL e PostgreSQL, responsável pela extração automatizada de dados do Denodo, execução de transformações e padronizações, validações de qualidade, controle de dependências, registro de logs, tratamento de falhas e execução de cargas completas ou incrementais. A parametrização por metadados permitiu definir tabelas, consultas, periodicidades, regras de atualização, destinos e dependências sem necessidade de alterações estruturais no código principal, tornando a solução reutilizável e escalável.
      
      Como resultado, o processo evoluiu de uma operação manual para uma infraestrutura estruturada de Engenharia de Dados, aumentando a confiabilidade, padronização e rastreabilidade das informações. A centralização dos dados em PostgreSQL reduziu dependências operacionais, retrabalho e riscos de inconsistência, além de acelerar a disponibilização das informações para Business Intelligence, dashboards, relatórios, indicadores e análises corporativas, fortalecendo a governança e a capacidade analítica da organização.
      
      Competências: Python · Luigi · PostgreSQL · SQL · Engenharia de Dados · ETL / ELT · Pipelines de Dados · Orquestração de Pipelines de Dados · Arquitetura Orientada por Metadados · Integração de Dados · Transformação de Dados · Qualidade de Dados · Governança de Dados · Processamento em Lote · Registro de Execuções · Monitoramento · Automação de Processos · Arquitetura Escalável"
    demo: "assets/www/cases/Engenharia-de-Dados-e-Modernização-Analítica.html"
    featured: true
  
  - id: analytics-shiny-dashboard
    title: "Plataforma Web para Gestão e Comercialização de Ativos Imobilizados"
    short_description: "O projeto consistiu no desenvolvimento de uma plataforma web corporativa para digitalizar, centralizar e automatizar o processo de gestão e comercialização de ativos imobilizados destinados a colaboradores de uma instituição financeira cooperativa. Antes da solução, o processo era descentralizado e dependente de planilhas, controles manuais, comunicação entre áreas e acompanhamento individual das etapas, gerando elevado esforço administrativo, retrabalho, baixa rastreabilidade e dificuldade para identificar o estágio de cada venda.
      A solução foi desenvolvida em R Shiny e PostgreSQL, integrando aplicação, dados, regras de negócio, automação documental e workflow operacional em uma única plataforma. O sistema incorporou autenticação de usuários, catálogo de ativos, galeria de imagens, consulta de disponibilidade, seleção e reserva de unidades, registro das vendas, integração com bases corporativas de colaboradores e associados, geração automatizada de contratos, acompanhamento de assinaturas e controle das etapas de entrega.

      O fluxo foi estruturado de forma padronizada, acompanhando o ciclo Disponível → Reservado (Vendido) → Contrato Gerado → Contrato Assinado → Entregue. Essa abordagem transformou um conjunto de atividades administrativas fragmentadas em um processo digital orientado por estados, regras e dados estruturados, permitindo maior controle sobre cada transação.

      A plataforma apoiou a comercialização de mais de 60 unidades, contribuindo para reduzir controles manuais e atividades repetitivas, aumentar a eficiência operacional, melhorar a governança e a transparência entre as áreas envolvidas e proporcionar maior rastreabilidade sobre reservas, contratos, aprovações, separação e entrega dos ativos. O projeto demonstrou a aplicação de R, Shiny e PostgreSQL na construção de sistemas corporativos voltados à transformação digital e otimização de processos.
      
      Competências: R · Shiny · PostgreSQL · Web Application Development · Application Architecture · Data Modeling · Process Automation · Workflow Management · Systems Integration · Business Systems Development"
