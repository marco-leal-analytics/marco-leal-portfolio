  - id: analytics-shiny-dashboard
    title: "Proposição de Estudo: Correlação entre Risco de Crédito e Perda Esperada para Otimização da Precificação"
    short_description: "O projeto de Credit Analytics, Risk Analytics e Modelagem de Risco foi desenvolvido para analisar quantitativamente a relação entre risco de crédito, inadimplência, perda esperada e rentabilidade da carteira, criando uma estrutura analítica para apoiar decisões de pricing, concessão e gestão de portfólio. O principal desafio era compreender a heterogeneidade dos clientes e avaliar se as condições de crédito praticadas estavam adequadamente alinhadas ao risco assumido e ao retorno econômico esperado.
      A solução combinou análise exploratória de dados, segmentação de clientes, análise de correlação do score em relação a perda esperada. A partir dessas análises, foram identificados diferentes padrões de comportamento entre segmentos, produtos, faixas de score e perfis de risco, permitindo avaliar a distribuição da exposição, concentração, inadimplência, perdas e rentabilidade.
      Como principal resultado, foi estruturada uma Matriz de Risco capaz de relacionar níveis de risco, perda esperada e retorno ajustado ao risco, criando subsídios para uma estratégia de precificação mais granular. A abordagem permitiu identificar segmentos com melhor relação risco-retorno, oportunidades de pricing diferenciado e grupos que demandavam revisão de políticas ou exposição.
      Competências: Credit Analytics · Risk Analytics · Credit Risk Modeling · Expected Loss · Statistical Modeling · Quantitative Analysis · Portfolio Analytics · Risk-Adjusted Return · Pricing Strategy · Excel"
