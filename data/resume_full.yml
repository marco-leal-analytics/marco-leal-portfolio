      - text: "Desenvolvimento de um estudo utilizando excel avançado para análise de risco, inadimplência, perda esperada e rentabilidade,
      análise exploratória para segmentação de clientes e estudos de risco-retorno, com foco em precificação diferenciada, otimização da 
