  - id: analytics-shiny-dashboard
    title: "Dashboard de Originação e Monitoramento de Políticas de Crédito"
    short_description: "Desenvolvimento de dashboard analítico em Power BI para monitoramento da jornada de aproximadamente 1,6 milhão de propostas de crédito por mês, acompanhando todo o funil de originação desde a digitação inicial até a aprovação para mesa de análise. A solução permitiu o acompanhamento operacional e estratégico de indicadores críticos de crédito, suportando áreas de Negócios, Crédito, Risco e Operações. Com base nos dados apresentados, o painel monitorava volumes superiores a 1.664.003 propostas digitadas, 936.051 propostas recusadas e 691.855 propostas aprovadas em P1, permitindo análises detalhadas da performance da esteira de crédito. 
      Foram implementadas análises para monitoramento das regras parametrizadas no motor de crédito Crivo, possibilitando avaliar o impacto individual de cada política sobre os resultados de aprovação, recusa e retenção de propostas. O dashboard disponibilizava visões multidimensionais por produto, modalidade, matriz, hierarquia comercial, UF, companhia elétrica, vendedor, período e faixa horária, ampliando significativamente a capacidade analítica das áreas de negócio.
      A solução também incorporou indicadores de evolução mensal, apresentando crescimento de 30,3% no volume de propostas digitadas, 36,8% no volume de recusas e 17,4% nas aprovações P1 entre períodos analisados, além de análises waterfall para identificação das regras com maior impacto na conversão das propostas ao longo da esteira de crédito. O projeto contribuiu para fortalecer a governança das políticas de crédito, identificar gargalos operacionais e apoiar decisões estratégicas baseadas em dados. 

      Competências: Credit Analytics, Risk Analytics, Business Intelligence, Power BI, Data Analytics, KPI Monitoring, Dashboard Development, Data Visualization, Decision Support, Business Analysis e Monitoramento de Políticas de Crédito." 
      
