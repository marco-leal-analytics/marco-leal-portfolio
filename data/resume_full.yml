  - id: analytics-shiny-dashboard
    title: "Painel de Acompanhamento de Incidência de Casos — 15ª Regional de Saúde"
    short_description: "O projeto foi desenvolvido em parceria com a Universidade Estadual de Maringá (UEM) e a 15ª Regional de Saúde do Paraná, com o objetivo de transformar dados epidemiológicos da COVID-19 em informações acessíveis para acompanhamento e apoio à tomada de decisão. A necessidade surgiu diante do grande volume de dados gerados durante a pandemia e da importância de acompanhar a evolução dos casos de forma regionalizada, permitindo identificar diferentes padrões de incidência entre os municípios.
      Como solução, foi desenvolvido um painel interativo utilizando **R e Shiny**, estruturado para consolidar, analisar e apresentar indicadores epidemiológicos de maneira dinâmica. A aplicação possibilitou explorar a incidência de casos, acompanhar a evolução temporal da doença e analisar a distribuição dos registros entre os municípios da 15ª Regional de Saúde. A abordagem de **Data Analytics e Data Visualization** permitiu transformar dados epidemiológicos em informações visuais mais intuitivas, facilitando a interpretação dos indicadores e a comparação entre diferentes períodos e localidades.
      O painel contribuiu para ampliar a capacidade de monitoramento epidemiológico, oferecendo uma ferramenta de **Decision Support** para profissionais e gestores de saúde. Ao centralizar indicadores e disponibilizar análises de forma interativa, a solução apoiou a identificação de tendências, a avaliação da evolução da pandemia e o direcionamento de ações de acompanhamento. O projeto demonstrou, na prática, como tecnologias de análise de dados e aplicações web em R podem ser utilizadas para apoiar decisões estratégicas em saúde pública."
