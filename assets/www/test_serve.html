<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Teste de Assets</title>
  <style>body{font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#111;padding:24px}img{max-width:220px;margin:12px;border-radius:8px;}</style>
</head>
<body>
  <h1>Teste de Assets</h1>
  <p>Verifique abaixo se cada imagem carrega corretamente via caminho exposto por `addResourcePath("assets", ...)`.</p>
  <h3>JPG</h3>
  <img src="assets/www/foto_perfil.jpg" alt="foto_perfil.jpg">
  <h3>WEBP</h3>
  <img src="assets/www/foto_perfil.webp" alt="foto_perfil.webp">
  <h3>SVG</h3>
  <img src="assets/www/foto_perfil.svg" alt="foto_perfil.svg">
  <h3>Background Header (via CSS)</h3>
  <div style="width:640px;height:200px;background-image:url('assets/www/header_.webp');background-size:cover;border-radius:8px;border:1px solid #ddd;margin-top:12px"></div>
  <p>Se algum recurso não carregar aqui, copie o caminho exato e verifique erros no DevTools (Network).</p>
</body>
</html>
